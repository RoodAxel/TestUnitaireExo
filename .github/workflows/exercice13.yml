name: CI Exercice13

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Exercice13
    steps:
      - name: Récupération du projet
        uses: actions/checkout@v4

      - name: Installation de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Exécution des tests et génération des rapports
        run: mvn -B test

      - name: Archivage des artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            Exercice13/target/surefire-reports
            Exercice13/target/site/jacoco
            Exercice13/target/cucumber-reports
